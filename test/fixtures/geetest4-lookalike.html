<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Puzzle games: match three</title>
  <!-- a page that copies GeeTest's class names for its own game; no script from GeeTest's hosts -->
  <script src="https://cdn.example/js/geetest-style-game.js"></script>
</head>
<body>
  <h1>Match three</h1>
  <p>Our tile game borrows the look of the GeeTest captcha. Click to verify you like it.</p>
  <div class="geetest_captcha">
    <div class="geetest_btn_click" style="width:300px;height:44px">Click to verify</div>
    <div class="geetest_box">
      <div class="geetest_text_tips">Click and swap to line up three identical items in a row</div>
      <div class="geetest_subitem geetest_match">
        <div class="geetest_item-0-0 geetest_backimg" style="left:0%;top:0%"></div>
        <div class="geetest_img-0 geetest_item_0" style="background-image:url(https://cdn.example/emoji1.png)"></div>
      </div>
      <div class="geetest_submit">Confirm</div>
    </div>
  </div>
  <div class="geetest_subitem_lookalike geetest_click_game"></div>
</body>
</html>
