<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Browsa Solver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="icons/icon-32.png" alt="" width="20" height="20">
    <h1 class="name" data-i18n="short_name"></h1>
    <span class="bal" id="balance" role="status"></span>
    <label class="switch" data-i18n-title="t_on_off"><input type="checkbox" id="enabled" data-i18n-label="l_solver_on"><span></span></label>
  </header>

  <section class="offbar" id="offBar" hidden>
    <span data-i18n="off_bar"></span>
    <button type="button" class="ghost sm" id="turnOn" data-i18n="a_turn_on"></button>
  </section>

  <main class="body" id="main">
    <section class="onboard" id="onboard" hidden>
      <p data-i18n="onboard"></p>
      <div class="row">
        <a class="primary btn" id="getKey" href="https://app.browsa.io/signup" target="_blank" rel="noopener" data-i18n="a_get_key"></a>
        <button type="button" class="link" id="haveKey" data-i18n="a_have_key"></button>
      </div>
    </section>

    <section class="keybox" id="keyBox" hidden>
      <p class="keymsg" id="keyMsg" role="alert" hidden></p>
      <div class="key" id="keyRow">
        <input id="apiKey" type="password" autocomplete="off" spellcheck="false" data-i18n-label="l_api_key">
        <button id="saveKey" class="ghost" type="button" data-i18n="a_save"></button>
      </div>
    </section>

    <section class="row">
      <div class="seg" role="radiogroup" data-i18n-label="l_mode">
        <button type="button" role="radio" data-mode="auto" data-i18n="mode_auto" data-i18n-title="t_mode_auto"></button>
        <button type="button" role="radio" data-mode="manual" data-i18n="mode_manual" data-i18n-title="t_mode_manual"></button>
      </div>
      <button id="solve" class="primary" type="button" data-i18n="a_solve"></button>
    </section>
    <p class="status" id="status" role="status" aria-live="polite" hidden></p>

    <fieldset class="types" id="types"><legend class="sr" data-i18n="l_types"></legend></fieldset>
    <p class="hint" id="typeHint" hidden></p>

    <section class="site" id="siteRow" hidden>
      <span class="host" id="host"></span>
      <label class="mini" data-i18n-title="t_text_site"><input type="checkbox" id="textSite"><span data-i18n="picture_text"></span></label>
      <label class="mini"><input type="checkbox" id="skipSite"><span data-i18n="skip_site"></span></label>
    </section>

    <section class="log" data-i18n-label="l_recent">
      <ol id="log"></ol>
    </section>

    <footer class="foot">
      <button type="button" class="link" id="openOptions" data-i18n="a_options"></button>
      <a class="privacy" href="privacy.html" target="_blank" data-i18n="a_privacy"></a>
      <a class="privacy" href="https://browsa.io/extension" target="_blank" rel="noopener" data-i18n="a_help"></a>
      <span id="version"></span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
